services:
    floci:
        image: floci/floci:latest-compat
        container_name: floci
        environment:
            - FLOCI_HOSTNAME=floci
        ports:
            - "127.0.0.1:4566:4566"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./floci/init/ready.d:/etc/floci/init/ready.d:ro
            - ./floci/artifacts:/etc/floci/artifacts:ro
    api:
        build: .
        ports:
            - "5128:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - Storage__S3__ServiceUrl=http://floci:4566
            - AWS_ACCESS_KEY_ID=test
            - AWS_SECRET_ACCESS_KEY=test
        depends_on:
            floci:
                condition: service_healthy
