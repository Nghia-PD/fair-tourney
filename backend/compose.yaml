services:
    postgres:
        image: postgres:18
        container_name: postgres
        environment:
            - POSTGRES_DB=fair_tourney
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        ports:
            - "127.0.0.1:5433:5432"  # 5433 on the host: a native PostgreSQL may already own 5432
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d fair_tourney"]
            interval: 5s
            timeout: 5s
            retries: 10
    floci:
        image: floci/floci:latest-compat
        container_name: floci
        environment:
            - FLOCI_HOSTNAME=floci
        ports:
            - "127.0.0.1:4566:4566"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./floci/init/ready.d:/etc/floci/init/ready.d:ro
            - ./floci/artifacts:/etc/floci/artifacts:ro
    api:
        build: .
        ports:
            - "5128:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - Storage__S3__ServiceUrl=http://floci:4566
            - AWS_ACCESS_KEY_ID=test
            - AWS_SECRET_ACCESS_KEY=test
            - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fair_tourney;Username=postgres;Password=postgres
        depends_on:
            floci:
                condition: service_healthy
            postgres:
                condition: service_healthy

volumes:
    postgres-data:
