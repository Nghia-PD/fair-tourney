services:
    floci:
        image: floci/floci:latest # pin to a specific version once it works
        container_name: floci
        ports:
            - "127.0.0.1:4566:4566"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
    api:
        build: .
        ports:
            - "5128:8080"
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - Storage__S3__ServiceUrl=http://floci:4566
            - AWS_ACCESS_KEY_ID=test
            - AWS_SECRET_ACCESS_KEY=test
        depends_on:
            floci:
                condition: service_healthy
